<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיחה בלחיצה</title>
  <meta name="theme-color" content="#FFE15A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-bg: #FFE8EC;
      --hint: #756B92;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sun) url("assets/bg-dots.svg") repeat;
    }
    .doodles {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      pointer-events: none;
    }
    main {
      position: relative;
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
    }
    .logo { display: block; width: 300px; max-width: 100%; margin: 8px auto 0; }
    .intro { margin: 0; text-align: center; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
    label { font-size: 18px; font-weight: 600; }
    input {
      width: 100%;
      font: 500 19px "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 12px 16px;
      transform: rotate(0.6deg);
      margin-top: 6px;
    }
    input::placeholder { color: var(--hint); }
    input:focus { outline: 4px solid var(--blue); }
    button {
      min-height: 64px;
      width: 100%;
      font: 700 24px "Fredoka", system-ui, sans-serif;
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      transform: rotate(-1deg);
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:active, button:disabled {
      transform: translateY(6px) rotate(-1deg);
      box-shadow: 0 2px 0 var(--ink);
    }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
    .bubble {
      position: relative;
      min-height: 190px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .bubble[data-state="error"] { background: var(--error-bg); }
    .mascot { width: 118px; height: auto; }
    .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
    .bubble[data-state="think"] .mascot { animation: squish 1s ease-in-out infinite; }
    .bubble[data-state="error"] .mascot { animation: wobble 0.8s ease-in-out 2; }
    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -34px;
      right: -14px;
      width: 86px;
      transform: rotate(8deg);
      animation: roll 0.9s ease-in-out 4;
    }
    .bubble[data-state="joke"] { justify-content: flex-start; padding-top: 44px; }
    #text { margin: 0; font-size: 18px; font-weight: 500; color: var(--ink-soft); }
    .bubble[data-state="joke"] #text {
      font: 500 25px/1.55 "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif;
      color: var(--ink);
    }
    .bubble[data-state="error"] #text { color: var(--error); font-weight: 600; }
    footer { margin-top: auto; padding-top: 10px; text-align: center; font-size: 13px; color: var(--ink-soft); }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes squish { 50% { transform: scale(0.86); } }
    @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    @keyframes roll { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-14deg); } }
    @media (prefers-reduced-motion: reduce) {
      .mascot { animation: none !important; }
    }
  </style>
</head>
<body>
  <img class="doodles" src="assets/bg-doodles.svg" alt="">
  <main>
    <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
    <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="form" autocomplete="off">
      <label for="topic">על מה הבדיחה?</label>
      <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים">
      <button id="go" type="submit" style="margin-top:14px">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle" aria-live="polite">
      <img class="mascot" id="mascot" src="assets/mascot-idle.svg" alt="">
      <p id="text">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    </section>

    <footer>מיישם AI ואוטומציה · 53500</footer>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.error("sw register failed", err));
    }

    const form = document.getElementById("form");
    const topicInput = document.getElementById("topic");
    const go = document.getElementById("go");
    const bubble = document.getElementById("bubble");
    const mascot = document.getElementById("mascot");
    const text = document.getElementById("text");

    function setState(state, message, label) {
      bubble.dataset.state = state;
      mascot.src = "assets/mascot-" + state + ".svg";
      text.textContent = message;
      go.textContent = label;
      go.disabled = state === "think";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const topic = topicInput.value.trim();
      setState("think", topic ? "מחפש בדיחה על " + topic + "..." : "מחפש בדיחה...", "חושב...");
      try {
        const response = await fetch("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        const data = await response.json();
        if (!response.ok || !data.joke) throw new Error(data.error || "משהו השתבש. אפשר לנסות שוב.");
        setState("joke", data.joke, "עוד בדיחה!");
      } catch (err) {
        const known = err instanceof Error && /[֐-׿]/.test(err.message);
        setState("error", known ? err.message : "משהו השתבש. אפשר לנסות שוב.", "לנסות שוב");
      }
    });
  </script>
</body>
</html>
