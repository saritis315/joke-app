<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיחה בלחיצה</title>
  <meta name="theme-color" content="#FFD60A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFD60A;
      --sun-top: #FFE53D;
      --sun-bottom: #FFAE1A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F25C00;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-bg: #FFE8EC;
      --hint: #756B92;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: url("assets/bg-dots.svg") repeat, linear-gradient(180deg, var(--sun-top), var(--sun) 45%, var(--sun-bottom)) fixed;
    }
    .doodles {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      pointer-events: none;
    }
    main {
      position: relative;
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
    }
    .logo { display: block; width: 300px; max-width: 100%; margin: 8px auto 0; }
    .intro { margin: 0; text-align: center; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
    label { font-size: 18px; font-weight: 600; }
    input {
      width: 100%;
      font: 500 19px "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 12px 16px;
      transform: rotate(0.6deg);
      margin-top: 6px;
    }
    input::placeholder { color: var(--hint); }
    input:focus { outline: 4px solid var(--blue); }
    #go {
      min-height: 64px;
      width: 100%;
      font: 700 24px "Fredoka", system-ui, sans-serif;
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      transform: rotate(-1deg);
      cursor: pointer;
      margin-bottom: 8px;
    }
    #go:active, #go:disabled {
      transform: translateY(6px) rotate(-1deg);
      box-shadow: 0 2px 0 var(--ink);
    }
    #go:disabled { cursor: default; }
    .star {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 48px;
      height: 48px;
      padding: 0;
      font: 700 28px/1 "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 50%;
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
    }
    .star[aria-pressed="true"] { background: var(--sun); }
    .star:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .improve {
      min-height: 44px;
      padding: 6px 18px;
      font: 600 18px "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
    }
    .improve:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .improve:disabled { cursor: default; opacity: .6; }
    .improve[hidden] { display: none; }
    .saved { display: flex; flex-direction: column; gap: 10px; }
    .saved[hidden] { display: none; }
    .saved h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .saved ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .saved li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 12px 14px;
      font-size: 18px;
      line-height: 1.5;
    }
    .saved li span { flex: 1; }
    .saved li button {
      flex: none;
      min-width: 44px;
      min-height: 44px;
      font: 600 16px "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sun);
      border: 2px solid var(--ink);
      border-radius: 12px;
      cursor: pointer;
    }
    button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
    .bubble {
      position: relative;
      min-height: 190px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .bubble[data-state="error"] { background: var(--error-bg); }
    .mascot { width: 118px; height: auto; }
    .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
    .bubble[data-state="think"] .mascot { animation: squish 1s ease-in-out infinite; }
    .bubble[data-state="error"] .mascot { animation: wobble 0.8s ease-in-out 2; }
    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -34px;
      right: -14px;
      width: 86px;
      transform: rotate(8deg);
      animation: roll 0.9s ease-in-out 4;
    }
    .bubble[data-state="joke"] { justify-content: flex-start; padding-top: 44px; }
    #text { margin: 0; font-size: 18px; font-weight: 500; color: var(--ink-soft); }
    .bubble[data-state="joke"] #text {
      font: 500 25px/1.55 "Fredoka", system-ui, sans-serif;
      color: var(--ink);
    }
    .bubble[data-state="error"] #text { color: var(--error); font-weight: 600; }
    footer { margin-top: auto; padding-top: 10px; text-align: center; font-size: 13px; color: var(--ink-soft); }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes squish { 50% { transform: scale(0.86); } }
    @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    @keyframes roll { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-14deg); } }
    @media (prefers-reduced-motion: reduce) {
      .mascot { animation: none !important; }
    }
  </style>
</head>
<body>
  <img class="doodles" src="assets/bg-doodles.svg" alt="">
  <main>
    <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
    <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="form" autocomplete="off">
      <label for="topic">על מה הבדיחה?</label>
      <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים">
      <button id="go" type="submit" style="margin-top:14px">מה הבדיחה?</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle" aria-live="polite">
      <img class="mascot" id="mascot" src="assets/mascot-idle.svg" alt="">
      <p id="text">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
      <button class="improve" id="improve" type="button" hidden>שפרו את הבדיחה</button>
      <button class="star" id="star" type="button" aria-pressed="false" aria-label="שמירת הבדיחה" hidden>☆</button>
    </section>

    <section class="saved" id="saved" hidden>
      <h2>הבדיחות שלי</h2>
      <ul id="savedList"></ul>
    </section>

    <footer>מיישם AI ואוטומציה · 53500</footer>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.error("sw register failed", err));
    }

    const form = document.getElementById("form");
    const topicInput = document.getElementById("topic");
    const go = document.getElementById("go");
    const bubble = document.getElementById("bubble");
    const mascot = document.getElementById("mascot");
    const text = document.getElementById("text");

    function setState(state, message, label) {
      bubble.dataset.state = state;
      mascot.src = "assets/mascot-" + state + ".svg";
      text.textContent = message;
      go.textContent = label;
      go.disabled = state === "think";
      currentJoke = state === "joke" ? message : "";
      star.hidden = state !== "joke";
      improveBtn.hidden = state !== "joke";
      renderSaved();
    }

    const star = document.getElementById("star");
    const improveBtn = document.getElementById("improve");
    const saved = document.getElementById("saved");
    const savedList = document.getElementById("savedList");
    const STORAGE_KEY = "savedJokes";
    const MAX_SAVED = 50;
    let currentJoke = "";

    function loadSaved() {
      try {
        const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(list) ? list.filter((j) => typeof j === "string") : [];
      } catch (err) {
        return [];
      }
    }

    function storeSaved(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (err) {
        console.error("save failed", err);
      }
    }

    function renderSaved() {
      const list = loadSaved();
      saved.hidden = list.length === 0;
      savedList.replaceChildren(...list.map((joke) => {
        const item = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = joke;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "מחיקה";
        remove.setAttribute("aria-label", "מחיקת הבדיחה מהרשימה");
        remove.addEventListener("click", () => {
          storeSaved(loadSaved().filter((j) => j !== joke));
          renderSaved();
        });
        item.append(span, remove);
        return item;
      }));
      const isSaved = currentJoke !== "" && list.includes(currentJoke);
      star.textContent = isSaved ? "★" : "☆";
      star.setAttribute("aria-pressed", String(isSaved));
      star.setAttribute("aria-label", isSaved ? "ביטול שמירת הבדיחה" : "שמירת הבדיחה");
    }

    star.addEventListener("click", () => {
      if (!currentJoke) return;
      const list = loadSaved();
      const next = list.includes(currentJoke)
        ? list.filter((j) => j !== currentJoke)
        : [currentJoke, ...list].slice(0, MAX_SAVED);
      storeSaved(next);
      renderSaved();
    });

    renderSaved();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      requestJoke("");
    });

    improveBtn.addEventListener("click", () => {
      if (currentJoke) requestJoke(currentJoke);
    });

    async function requestJoke(improve) {
      const topic = topicInput.value.trim();
      const message = improve
        ? "משפר את הבדיחה..."
        : topic ? "מחפש בדיחה על " + topic + "..." : "מחפש בדיחה...";
      setState("think", message, "חושב...");
      try {
        const response = await fetch("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(improve ? { topic, improve } : { topic }),
        });
        const data = await response.json();
        if (!response.ok || !data.joke) throw new Error(data.error || "משהו השתבש. אפשר לנסות שוב.");
        setState("joke", data.joke, "עוד בדיחה!");
      } catch (err) {
        const known = err instanceof Error && /[֐-׿]/.test(err.message);
        setState("error", known ? err.message : "משהו השתבש. אפשר לנסות שוב.", "לנסות שוב");
      }
    }
  </script>
</body>
</html>
